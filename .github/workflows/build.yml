name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build macro.exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/macro.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: macro-windows
          path: dist/macro.exe
      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/macro.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
