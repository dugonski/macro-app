name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build macro.exe
        run: dotnet build -c Release -warnaserror -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: macro-windows
          path: dist/macro.exe
      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/macro.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
